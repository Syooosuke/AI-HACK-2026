version: 2
updates:
  # cooldown: 公開から 7 日経っていない版は提案しない（乗っ取られた版の取り込み対策）
  - package-ecosystem: npm
    directory: /spotcheck-ai/frontend
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /spotcheck-ai/backend
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /spotcheck-ai/frontend
      - /spotcheck-ai/backend
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
